<div id="pin-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; color: white; font-family: Arial;">
    <h2>Enter PIN to access MonkeyGG2</h2>
    <input type="password" id="pin-input" maxlength="6" style="padding: 12px; font-size: 18px; width: 200px; text-align: center;" placeholder="PIN">
    <button onclick="checkPin()" style="margin-top: 15px; padding: 10px 20px; font-size: 16px;">Submit</button>
    <p id="error" style="color: red; margin-top: 10px;"></p>
</div>

<script>
function checkPin() {
    const input = document.getElementById('pin-input').value;
    const correctPin = "hateschool";   // ← Change this to your desired PIN

    if (input === correctPin) {
        document.getElementById('pin-screen').style.display = 'none';
        // Optional: save to localStorage so they don't enter again on refresh
        localStorage.setItem('accessGranted', 'true');
    } else {
        document.getElementById('error').textContent = "Wrong PIN. Try again.";
    }
}

// Auto-check if already entered before
if (localStorage.getItem('accessGranted') === 'true') {
    document.getElementById('pin-screen').style.display = 'none';
}
</script>
